<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#081b33">
  <meta name="description" content="Estamos preparando algo nuevo. Muy pronto podrás descubrirlo.">
  <title>Próximamente</title>

  <style>
    :root {
      --azul-oscuro: #071a31;
      --azul: #0b315b;
      --azul-claro: #18a5c8;
      --dorado: #f2b84b;
      --blanco: #ffffff;
      --texto-suave: #c9d8e8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--blanco);
      background:
        radial-gradient(circle at 15% 10%, rgba(24, 165, 200, .22), transparent 30%),
        radial-gradient(circle at 90% 85%, rgba(242, 184, 75, .13), transparent 28%),
        linear-gradient(145deg, var(--azul-oscuro), var(--azul));
    }

    .page {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 20px;
    }

    .page::before,
    .page::after {
      content: "";
      position: fixed;
      z-index: -1;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 50%;
    }

    .page::before {
      width: 360px;
      height: 360px;
      top: -180px;
      right: -120px;
    }

    .page::after {
      width: 250px;
      height: 250px;
      bottom: -130px;
      left: -90px;
    }

    .card {
      width: min(100%, 680px);
      padding: clamp(32px, 7vw, 64px);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 32px;
      background: rgba(5, 23, 43, .58);
      box-shadow: 0 28px 80px rgba(0, 0, 0, .32);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 18px;
      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 999px;
      color: var(--texto-suave);
      background: rgba(255, 255, 255, .06);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--dorado);
      box-shadow: 0 0 0 5px rgba(242, 184, 75, .13);
      animation: pulse 2s ease-in-out infinite;
    }

    h1 {
      max-width: 560px;
      margin-inline: auto;
      font-size: clamp(2.35rem, 8vw, 4.6rem);
      line-height: .98;
      letter-spacing: -.055em;
    }

    h1 span {
      display: block;
      color: var(--dorado);
    }

    .message {
      max-width: 490px;
      margin: 24px auto 0;
      color: var(--texto-suave);
      font-size: clamp(1rem, 2.8vw, 1.12rem);
      line-height: 1.7;
    }

    .divider {
      width: 72px;
      height: 3px;
      margin: 30px auto;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--azul-claro), var(--dorado));
    }

    .footer {
      color: rgba(255, 255, 255, .64);
      font-size: .86rem;
      line-height: 1.5;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(.72); opacity: .65; }
    }

    @media (max-width: 520px) {
      .card {
        padding: 38px 22px;
        border-radius: 26px;
      }

    }

    @media (prefers-reduced-motion: reduce) {
      .status-dot { animation: none; }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card" aria-labelledby="titulo">
      <div class="eyebrow">
        <span class="status-dot" aria-hidden="true"></span>
        Sitio en construcción
      </div>

      <h1 id="titulo">Estamos creando algo <span>especial.</span></h1>

      <p class="message">
        Nuestro nuevo sitio está en camino. Estamos cuidando cada detalle
        para ofrecerte una gran experiencia.
      </p>

      <hr class="divider">

      <p class="footer">
        Muy pronto estaremos en línea<br>
        <span id="year"></span>
      </p>
    </section>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
